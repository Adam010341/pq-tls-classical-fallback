<text x="390.0" y="114" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="600">3,736</text>
<text x="557.7" y="114" font-size="12" fill="#f0efec" stroke="#1a1a19" stroke-width="5" stroke-linejoin="round" paint-order="stroke"><tspan font-weight="600">15.4%</tspan><tspan fill="#c3c2b7" dx="6">accept, of 4,417</tspan></text>
<text x="158" y="152" font-size="12" fill="#f0efec" text-anchor="end">15 Oct</text>
