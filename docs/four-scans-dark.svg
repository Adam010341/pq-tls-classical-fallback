<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 290" width="760" height="290" role="img" font-family='system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif'>
<title>Four scans of the same 10,000 domains</title>
<desc>9–10 Oct: 679 of 4417 hybrid-capable domains accept the classical share (15.4%); 15 Oct: 723 of 4461 hybrid-capable domains accept the classical share (16.2%); 24 Oct: 752 of 4561 hybrid-capable domains accept the classical share (16.5%); 4 Nov: 711 of 4714 hybrid-capable domains accept the classical share (15.1%)</desc>
<rect x="0.5" y="0.5" width="759" height="289" rx="8" fill="#1a1a19" stroke="#2c2c2a"/>
<text x="24" y="32" font-size="15" font-weight="600" fill="#f0efec">Four scans of the same 10,000 domains</text>
<text x="24" y="52" font-size="12" fill="#c3c2b7">Domains that select the hybrid group, split by what they do when offered only a classical key share</text>
<rect x="24" y="68" width="10" height="10" rx="2" fill="#d95926"/><text x="40" y="77" font-size="12" fill="#c3c2b7">accepts the classical share</text>
<rect x="216" y="68" width="10" height="10" rx="2" fill="#3987e5"/><text x="232" y="77" font-size="12" fill="#c3c2b7">asks for the hybrid share</text>
<line x1="170.0" y1="94" x2="170.0" y2="242" stroke="#383835" stroke-width="1"/>
<text x="170.0" y="258" font-size="11" fill="#898781" text-anchor="middle" style="font-variant-numeric: tabular-nums">0</text>
