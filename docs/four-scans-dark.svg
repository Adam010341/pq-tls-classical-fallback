<text x="256.0" y="258" font-size="11" fill="#898781" text-anchor="middle" style="font-variant-numeric: tabular-nums">1,000</text>
<line x1="342.0" y1="94" x2="342.0" y2="242" stroke="#2c2c2a" stroke-width="1"/>
<text x="342.0" y="258" font-size="11" fill="#898781" text-anchor="middle" style="font-variant-numeric: tabular-nums">2,000</text>
<line x1="428.0" y1="94" x2="428.0" y2="242" stroke="#2c2c2a" stroke-width="1"/>
<text x="428.0" y="258" font-size="11" fill="#898781" text-anchor="middle" style="font-variant-numeric: tabular-nums">3,000</text>
<line x1="514.0" y1="94" x2="514.0" y2="242" stroke="#2c2c2a" stroke-width="1"/>
<text x="514.0" y="258" font-size="11" fill="#898781" text-anchor="middle" style="font-variant-numeric: tabular-nums">4,000</text>
<line x1="600.0" y1="94" x2="600.0" y2="242" stroke="#2c2c2a" stroke-width="1"/>
<text x="600.0" y="258" font-size="11" fill="#898781" text-anchor="middle" style="font-variant-numeric: tabular-nums">5,000</text>
<text x="158" y="114" font-size="12" fill="#f0efec" text-anchor="end">9–10 Oct</text>
