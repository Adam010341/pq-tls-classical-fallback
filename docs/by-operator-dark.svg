<text x="528.5" y="128" font-size="12" fill="#f0efec" stroke="#1a1a19" stroke-width="5" stroke-linejoin="round" paint-order="stroke"><tspan font-weight="600">326</tspan><tspan fill="#c3c2b7" dx="6">45%</tspan></text>
<text x="158" y="166" font-size="12" fill="#f0efec" text-anchor="end">All other operators</text>
