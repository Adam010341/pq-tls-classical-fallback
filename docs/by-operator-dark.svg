<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 228" width="760" height="228" role="img" font-family='system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif'>
<title>Two CDNs host 83% of the domains that accept the classical share</title>
<desc>CDN A: 273 domains (38%). CDN B: 326 domains (45%). All other operators: 124 domains (17%).</desc>
<rect x="0.5" y="0.5" width="759" height="227" rx="8" fill="#1a1a19" stroke="#2c2c2a"/>
<text x="24" y="32" font-size="15" font-weight="600" fill="#f0efec">Two CDNs host 83% of the domains that accept the classical share</text>
<text x="24" y="52" font-size="12" fill="#c3c2b7">The 723 domains from the scan of 15 Oct 2026, by who serves them</text>
<line x1="170.0" y1="70" x2="170.0" y2="180" stroke="#383835" stroke-width="1"/>
<text x="170.0" y="196" font-size="11" fill="#898781" text-anchor="middle" style="font-variant-numeric: tabular-nums">0</text>
<line x1="277.5" y1="70" x2="277.5" y2="180" stroke="#2c2c2a" stroke-width="1"/>
<text x="277.5" y="196" font-size="11" fill="#898781" text-anchor="middle" style="font-variant-numeric: tabular-nums">100</text>
<line x1="385.0" y1="70" x2="385.0" y2="180" stroke="#2c2c2a" stroke-width="1"/>
<text x="385.0" y="196" font-size="11" fill="#898781" text-anchor="middle" style="font-variant-numeric: tabular-nums">200</text>
<line x1="492.5" y1="70" x2="492.5" y2="180" stroke="#2c2c2a" stroke-width="1"/>
<text x="492.5" y="196" font-size="11" fill="#898781" text-anchor="middle" style="font-variant-numeric: tabular-nums">300</text>
<line x1="600.0" y1="70" x2="600.0" y2="180" stroke="#2c2c2a" stroke-width="1"/>
<text x="600.0" y="196" font-size="11" fill="#898781" text-anchor="middle" style="font-variant-numeric: tabular-nums">400</text>
<text x="158" y="90" font-size="12" fill="#f0efec" text-anchor="end">CDN A</text>
<path d="M170.0,76 h289.5 a4,4 0 0 1 4,4 v12 a4,4 0 0 1 -4,4 h-289.5 z" fill="#d95926"/>
<text x="471.5" y="90" font-size="12" fill="#f0efec" stroke="#1a1a19" stroke-width="5" stroke-linejoin="round" paint-order="stroke"><tspan font-weight="600">273</tspan><tspan fill="#c3c2b7" dx="6">38%</tspan></text>
<text x="158" y="128" font-size="12" fill="#f0efec" text-anchor="end">CDN B</text>
